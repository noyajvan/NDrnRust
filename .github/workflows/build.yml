name: Build firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + toolchain + build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          curl -sL https://github.com/esp-rs/espup/releases/download/v0.17.1/espup-x86_64-unknown-linux-gnu.tar.gz -o espup.tar.gz
          tar -xzf espup.tar.gz
          ./espup install -t esp32s3 -f -l /tmp/export-esp.sh
          . /tmp/export-esp.sh
          cargo build --release

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: target/xtensa-esp32s3-none-elf/release/dropctrl-v3
