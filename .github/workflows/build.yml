name: Build ESP32 firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config

      - name: Install Xtensa toolchain via script
        run: |
          curl -sL https://raw.githubusercontent.com/esp-rs/rust-build/main/install-rust-toolchain.sh | \
            bash -s -- --target xtensa-esp32s3-none-elf --export-file ~/export-esp.sh
          source ~/export-esp.sh
          rustc --version

      - name: Install espflash
        run: cargo install espflash

      - name: Build
        run: source ~/export-esp.sh && cargo build --release

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: target/xtensa-esp32s3-none-elf/release/dropctrl-v3
