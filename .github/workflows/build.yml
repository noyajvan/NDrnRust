name: Build firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.espressif
            ~/.rustup/toolchains/esp
          key: esp-toolchain-${{ runner.os }}-v1

      - name: Install toolchain
        run: |
          curl -sLO https://github.com/esp-rs/espup/releases/download/v0.17.1/espup-x86_64-unknown-linux-gnu
          chmod +x espup-x86_64-unknown-linux-gnu
          ./espup-x86_64-unknown-linux-gnu install -t esp32s3 -f ~/export-esp.sh || echo "ESPUP_FAILED"
          . ~/export-esp.sh 2>/dev/null || true
          rustc --version 2>/dev/null || echo "RUSTC_FAILED"

      - name: Build
        run: |
          . ~/export-esp.sh 2>/dev/null || true
          cargo build --release

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: target/xtensa-esp32s3-none-elf/release/dropctrl-v3
