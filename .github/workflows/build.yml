name: Build ESP32 firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install espup
        run: cargo install espup --locked

      - name: Install Xtensa toolchain
        run: espup install -t xtensa-esp32s3-none-elf -f -l /tmp/export-esp.sh

      - name: Source ESP-IDF
        run: |
          . /tmp/export-esp.sh
          echo "IDF_PATH=$IDF_PATH" >> $GITHUB_ENV
          echo "IDF_TOOLS_PATH=$IDF_TOOLS_PATH" >> $GITHUB_ENV

      - name: Install espflash
        run: cargo install espflash --locked

      - name: Cache dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: |
          . /tmp/export-esp.sh
          cargo build --release

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: target/xtensa-esp32s3-none-elf/release/dropctrl-v3
