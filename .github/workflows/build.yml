name: Build ESP32 firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install binstall
        run: curl -LO https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-gnu.tgz && tar -xzf cargo-binstall-x86_64-unknown-linux-gnu.tgz -C ~/.cargo/bin

      - name: Install espup (binary, no compile)
        run: cargo binstall espup -y

      - name: Install Xtensa toolchain
        run: espup install -t xtensa-esp32s3-none-elf -f

      - name: Add target
        run: rustup target add xtensa-esp32s3-none-elf --toolchain esp

      - name: Install espflash
        run: cargo binstall espflash -y

      - name: Build release
        run: cargo build --release

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: target/xtensa-esp32s3-none-elf/release/dropctrl-v3
