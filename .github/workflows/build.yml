name: Build firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          docker run --rm -v $PWD:/workspace -w /workspace \
            espressif/idf-rust:esp32s3_latest \
            /bin/bash -c "cargo build --release"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: target/xtensa-esp32s3-none-elf/release/dropctrl-v3
