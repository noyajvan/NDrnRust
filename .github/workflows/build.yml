name: Build ESP32 firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps & update
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libudev-dev pkg-config
          rustup self update

      - name: Install espup binary
        run: |
          curl -LO https://github.com/esp-rs/espup/releases/latest/download/espup-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf espup-x86_64-unknown-linux-gnu.tar.gz
          sudo mv espup /usr/local/bin/
          espup --version

      - name: Install Xtensa toolchain
        run: |
          espup install -t xtensa-esp32s3-none-elf -f
          rustup toolchain list

      - name: Install espflash
        run: cargo install espflash

      - name: Build release
        run: cargo build --release

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: target/xtensa-esp32s3-none-elf/release/dropctrl-v3
