name: Build ESP32 firmware

on:
  push:
    branches: ["main"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libudev-dev pkg-config

      - name: Cache Cargo + Espressif
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.espressif
          key: ${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Install toolchain
        run: |
          cargo install espup --locked || true
          espup install -t xtensa-esp32s3-none-elf -f || true

      - name: Build
        run: |
          source ~/export-esp.sh 2>/dev/null || true
          cargo build --release

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: target/xtensa-esp32s3-none-elf/release/dropctrl-v3
          retention-days: 7
