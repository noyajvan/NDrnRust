[package]
name = "dropctrl-v3"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-hal = "0.23"
esp-println = { version = "0.13", features = ["jtag-serial"] }
esp-backtrace = { version = "0.15", features = ["esp32s3", "panic-handler", "exception-handler"] }
esp-alloc = { version = "0.6", features = ["esp32s3"] }
esp-wifi = { version = "0.10", features = ["esp32s3", "wifi-default", "tcp", "utils"] }
smoltcp = "0.11"

heapless = "0.8"
log = "0.4"
nb = "1"
embedded-hal = "1.0"
smart-leds = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = "s"
debug = 1
incremental = false
