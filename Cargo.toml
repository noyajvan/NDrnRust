[package]
name = "dropctrl-v3"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-idf-hal = "0.44"
esp-idf-sys = { version = "0.35", features = ["binstart"] }
esp-idf-svc = "0.50"
embedded-svc = "0.28"

mavlink = "0.12"

log = "0.4"
heapless = "0.8"
nb = "1"
embedded-hal = "1.0"
smart-leds = "0.4"
ws2812-esp32-rmt-driver = "0.6"

[build-dependencies]
embuild = "0.31"

[profile.dev]
opt-level = "s"     # оптимізація по розміру (менше місця в target/)
debug = 1            # reduced debug info
incremental = false  # не копить гігабайти проміжних сэмплів

[profile.release]
opt-level = "z"      # максимальне стиснення
lto = true
codegen-units = 1
strip = true
panic = "abort"
